# Fly.io deployment. The volume is what makes this work: the food log and the
# photos are files on disk, so the app needs storage that survives a restart.
app = "kilo"
primary_region = "syd"

[build]

[env]
  KILO_DATA_DIR = "/data"
  TZ = "Australia/Melbourne"

[[mounts]]
  source = "kilo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine only — two would each get their own volume and diverge.
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
